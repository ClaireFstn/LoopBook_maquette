.hand .grip,.hand .del{display:flex}
.pi{background:#DCE2D3;padding:6px 8px;font-family:'Caveat',cursive;line-height:1.1;transform:rotate(-2deg);box-shadow:1px 2px 3px rgba(50,30,20,.15);width:110px;min-height:54px;outline:none;box-sizing:border-box;color:#4E4A3A}
.tx{min-width:50px;max-width:240px;outline:none;line-height:1.35;padding:2px 3px;border:1px dashed transparent;color:#4E4A3A}
.tx:focus,.pi:focus{border-color:#C9C5B8}
.zl{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);background:#4E4A3A;color:#FBF7F0;font-size:10px;padding:2px 8px;border-radius:8px;z-index:5}
</style>
<div class="frame"><div class="ip"><div class="sc">
<div class="col"><div class="vt" id="vt"></div><div class="opt" id="opt"></div></div>
<div class="main"><div class="page" id="page"><div class="inner p-grid" id="inner"><div class="objs" id="objs"></div><canvas id="cv"></canvas></div></div><div class="zl" id="zl">100 %</div></div>
<div class="col"><div class="vt">
<div class="tbn ok" role="button" title="Terminé" aria-label="Terminé" onclick="location.href='cahier-portrait.html'"><i class="ti ti-check"></i></div>
<span class="hsep"></span>
<div class="tbn" role="button" id="un" title="Annuler" aria-label="Annuler"><i class="ti ti-arrow-back-up"></i></div>
<div class="tbn" role="button" id="re" title="Rétablir" aria-label="Rétablir"><i class="ti ti-arrow-forward-up"></i></div>
<span class="hsep"></span>
<div class="tbn" role="button" id="zi" title="Zoomer" aria-label="Zoomer"><i class="ti ti-zoom-in"></i></div>
<div class="tbn" role="button" id="zo" title="Dézoomer" aria-label="Dézoomer"><i class="ti ti-zoom-out"></i></div>
<span class="hsep"></span>
<div class="tbn" role="button" id="pp" title="Page précédente" aria-label="Page précédente"><i class="ti ti-chevron-up"></i></div>
<div class="pgl" id="pl">1<br>/1</div>
<div class="tbn" role="button" id="np" title="Page suivante" aria-label="Page suivante"><i class="ti ti-chevron-down"></i></div>
<span class="hsep"></span>
<div class="tbn" role="button" id="addp" title="Nouvelle page" aria-label="Nouvelle page"><i class="ti ti-file-plus"></i></div>
<div class="tbn" role="button" id="papb" title="Papier" aria-label="Changer de papier"><i class="ti ti-grid-dots" id="papi"></i></div>
</div></div>
</div></div>
</div><script>
(function(){
var T=[['hand','ti-hand-move','Déplacer'],['pen','ti-pencil','Stylo'],['hl','ti-highlight','Surligneur'],['er','ti-eraser','Gomme'],'|',['tx','ti-typography','Texte'],['scr','ti-writing','Écriture convertie'],['pi','ti-note','Post-it'],['ph','ti-photo','Photo'],['vd','ti-video','Vidéo'],['ln','ti-link','Lien']];
var COL=['#2E2B22','#9B6B57','#B5653F','#7E9470','#D4A957'],HLC=['#C9962E','#8FA07E','#D39A80','#86AEDC','#26301F'],HW=[9,15,22],PIC=['#DCE2D3','#E3CFC4','#ECC9B5','#FBF7F0'];
var PAP=[['grid','ti-grid-dots'],['lines','ti-align-justified'],['dots','ti-dots'],['blank','ti-square']];
var FS={tx:[10,12,15],scr:[10,12,15],h:[13,16,20],pi:[13,16,20]};
var tool='pen',col=0,hcol=0,wd=1,hwd=1,pic=0,em=0,ts=1,z=1,focusId=null,pages=[{paper:0,strokes:[],objs:[{id:1,t:'h',s:1,x:16,y:12,v:'Pull marin · col'},{id:2,t:'tx',s:1,x:16,y:40,v:'Reprendre le col en ms, 3 rangs, puis 1 rang de mc pour finir proprement.'},{id:3,t:'pi',s:1,x:200,y:130,v:'Bain de laine',c:0}]}],cur=0,undo=[],redo=[],nid=10;
var vt=document.getElementById('vt'),opt=document.getElementById('opt'),page=document.getElementById('page'),inner=document.getElementById('inner'),objs=document.getElementById('objs'),cv=document.getElementById('cv'),ctx=cv.getContext('2d');
function P(){return pages[cur];}
function cc(){return tool=='hl'?HLC[hcol]:COL[col];}
function drawTb(){var h='';T.forEach(function(x){if(x=='|'){h+='<span class="hsep"></span>';return;}h+='<div role="button" class="tbn'+(x[0]==tool?' on':'')+'" data-t="'+x[0]+'" title="'+x[2]+'" aria-label="'+x[2]+'"><i class="ti '+x[1]+'"></i></div>';});vt.innerHTML=h;}
vt.addEventListener('click',function(e){var b=e.target.closest('[data-t]');if(!b)return;tool=b.dataset.t;drawTb();drawOpt();sync();});
function sizes(){var h='<span class="hsep"></span>';[0,1,2].forEach(function(i){h+='<span class="wd'+(i==ts?' on':'')+'" data-ts="'+i+'" title="'+['Petit','Moyen','Grand'][i]+'" style="font-size:'+[10,13,17][i]+'px">A</span>';});return h;}
function drawOpt(){var h='';
if(tool=='pen'){COL.forEach(function(c,i){h+='<span class="sw'+(i==col?' on':'')+'" data-col="'+i+'" style="background:'+c+'"></span>';});h+='<span class="sw" style="background:#FBF7F0;border:1.5px dashed #9B6B57"><i class="ti ti-plus" style="font-size:10px;color:#9B6B57"></i></span><span class="hsep"></span>';[1.2,2.4,4].forEach(function(w,i){h+='<span class="wd'+(i==wd?' on':'')+'" data-wd="'+i+'"><span style="width:'+(w*2+2)+'px;height:'+(w*2+2)+'px;border-radius:50%;background:'+COL[col]+'"></span></span>';});}
else if(tool=='hl'){HLC.forEach(function(c,i){h+='<span class="sw'+(i==hcol?' on':'')+'" data-hc="'+i+'" style="background:'+c+'"></span>';});h+='<span class="hsep"></span>';HW.forEach(function(w,i){h+='<span class="wd'+(i==hwd?' on':'')+'" data-hw="'+i+'" title="'+['Fin','Moyen','Large'][i]+'"><span style="width:16px;height:'+Math.round(w/3)+'px;border-radius:2px;background:'+HLC[hcol]+';opacity:.75"></span></span>';});}
else if(tool=='pi'){PIC.forEach(function(c,i){h+='<span class="sw'+(i==pic?' on':'')+'" data-pic="'+i+'" style="background:'+c+';border-radius:3px"></span>';});h+=sizes();}
else if(tool=='tx'||tool=='scr'){COL.forEach(function(c,i){h+='<span class="sw'+(i==col?' on':'')+'" data-col="'+i+'" style="background:'+c+'"></span>';});h+=sizes();}
else if(tool=='er'){h+='<span class="em'+(em==0?' on':'')+'" data-em="0" title="Effacer le trait entier"><i class="ti ti-line"></i>trait</span><span class="em'+(em==1?' on':'')+'" data-em="1" title="Effacer une zone"><i class="ti ti-circle-dotted"></i>zone</span>';}
opt.innerHTML=h;opt.style.display=h?'flex':'none';}
opt.addEventListener('mousedown',function(e){e.preventDefault();});
opt.addEventListener('click',function(e){var t=e.target.closest('[data-col],[data-wd],[data-pic],[data-hc],[data-em],[data-ts],[data-hw]');if(!t)return;var d=t.dataset;if(d.hw)hwd=+d.hw;if(d.col)col=+d.col;if(d.wd)wd=+d.wd;if(d.pic)pic=+d.pic;if(d.hc)hcol=+d.hc;if(d.em)em=+d.em;
if(d.ts){ts=+d.ts;var o=P().objs.find(function(x){return x.id==focusId});if(o&&FS[o.t]){o.s=ts;drawObjs();}}
if(d.col&&(tool=='tx'||tool=='scr')){var o2=P().objs.find(function(x){return x.id==focusId});if(o2&&(o2.t=='tx'||o2.t=='h'||o2.t=='scr')){o2.c2=COL[col];drawObjs();}}
drawOpt();});
function sync(){cv.style.pointerEvents=(tool=='pen'||tool=='hl'||tool=='er')?'auto':'none';inner.classList.toggle('hand',tool=='hand');}
var BW=0,BH=0;
function size(){var r=page.getBoundingClientRect(),d=window.devicePixelRatio||1;BW=r.width;BH=r.height;inner.style.width=BW+'px';inner.style.height=BH+'px';cv.width=BW*d;cv.height=BH*d;cv.style.width=BW+'px';cv.style.height=BH+'px';ctx.setTransform(d,0,0,d,0,0);applyZ();redraw();}
function applyZ(){inner.style.transform='scale('+z+')';var sp=document.getElementById('sp');if(!sp){sp=document.createElement('div');sp.id='sp';sp.style.position='absolute';sp.style.width='1px';sp.style.height='1px';page.appendChild(sp);}sp.style.left=(BW*z-1)+'px';sp.style.top=(BH*z-1)+'px';document.getElementById('zl').textContent=Math.round(z*100)+' %';}
function dS(s){ctx.save();ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle=s.c||'#000';var p=s.pts;
if(s.z){ctx.globalCompositeOperation='destination-out';ctx.lineWidth=16;ctx.beginPath();ctx.moveTo(p[0][0],p[0][1]);for(var i=1;i<p.length;i++)ctx.lineTo(p[i][0],p[i][1]);if(p.length<2)ctx.lineTo(p[0][0]+.01,p[0][1]);ctx.stroke();ctx.restore();return;}
if(s.hl)ctx.globalAlpha=s.ha||.55;
if(s.st||p.length<2){ctx.lineWidth=s.hl?(s.hw||14):s.w*1.3;ctx.beginPath();ctx.moveTo(p[0][0],p[0][1]);ctx.lineTo(p[p.length-1][0],p[p.length-1][1]+(p.length<2?.01:0));ctx.stroke();}
else if(s.hl){ctx.lineWidth=s.hw||14;ctx.beginPath();ctx.moveTo(p[0][0],p[0][1]);for(var i=1;i<p.length;i++)ctx.lineTo(p[i][0],p[i][1]);ctx.stroke();}
else{for(var i=1;i<p.length;i++){ctx.lineWidth=s.w*(0.6+p[i][2]*1.2);ctx.beginPath();ctx.moveTo(p[i-1][0],p[i-1][1]);ctx.lineTo(p[i][0],p[i][1]);ctx.stroke();}}ctx.restore();}
function redraw(){ctx.clearRect(0,0,cv.width,cv.height);P().strokes.forEach(dS);}
function oHtml(o){var g='<span class="grip" data-g="'+o.id+'"><i class="ti ti-arrows-move"></i></span><span class="del" data-d="'+o.id+'"><i class="ti ti-x"></i></span>',s='<div class="ob" data-id="'+o.id+'" style="left:'+o.x+'px;top:'+o.y+'px">'+g,fs=FS[o.t]?FS[o.t][o.s]:11,cl=o.c2?'color:'+o.c2+';':'';
if(o.t=='h')return s+'<div class="tx" contenteditable="true" style="'+cl+'font-family:Fraunces,serif;font-size:'+fs+'px;font-weight:500">'+o.v+'</div></div>';
if(o.t=='tx'||o.t=='scr')return s+'<div class="tx" contenteditable="true" style="'+cl+'font-size:'+fs+'px;'+(o.t=='scr'?'border-color:#A8B49A;background:rgba(220,226,211,.35)':'')+'">'+o.v+'</div></div>';
if(o.t=='pi')return s+'<div class="pi" contenteditable="true" style="font-size:'+fs+'px;background:'+PIC[o.c]+'">'+o.v+'</div></div>';
if(o.t=='ph')return s+'<div style="width:100px;height:72px;border-radius:4px;background:#C9C5B8;display:flex;align-items:center;justify-content:center;box-shadow:1px 2px 4px rgba(50,30,20,.2)"><i class="ti ti-photo" style="font-size:22px;color:#4E4A3A"></i></div></div>';
if(o.t=='vd')return s+'<div style="width:100px;height:72px;border-radius:4px;background:#4E4A3A;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;box-shadow:1px 2px 4px rgba(50,30,20,.2)"><i class="ti ti-repeat" style="font-size:20px;color:#FBF7F0"></i><span style="font-size:9px;color:#FBF7F0">0:08 · boucle · x0,5</span></div></div>';
if(o.t=='ln')return s+'<div style="display:flex;gap:6px;align-items:center;background:#FBF7F0;border:1px solid #E3D6C3;border-radius:6px;padding:4px;width:150px"><div style="width:34px;height:23px;border-radius:3px;background:#B5653F;display:flex;align-items:center;justify-content:center;flex-shrink:0"><i class="ti ti-player-play" style="color:#F4EDE1"></i></div><div style="min-width:0;font-size:10px;color:#4E4A3A">Tuto point écrevisse<br><span style="color:#888780;font-size:9px">youtube.com</span></div></div></div>';}
function drawObjs(){objs.innerHTML=P().objs.map(oHtml).join('');}
objs.addEventListener('focusin',function(e){var ob=e.target.closest('.ob');if(!ob)return;focusId=+ob.dataset.id;var o=P().objs.find(function(x){return x.id==focusId});if(o&&FS[o.t]){ts=o.s;if(tool=='tx'||tool=='scr'||tool=='pi')drawOpt();}});
function drawPage(){inner.className='inner p-'+PAP[P().paper][0]+(tool=='hand'?' hand':'');document.getElementById('papi').className='ti '+PAP[P().paper][1];document.getElementById('pl').innerHTML=(cur+1)+'<br>/'+pages.length;drawObjs();redraw();}
function pos(e){var r=inner.getBoundingClientRect();return [(e.clientX-r.left)/z,(e.clientY-r.top)/z,e.pressure||0.5];}
var drawing=null,tmr=null,lastP=null;
cv.addEventListener('pointerdown',function(e){cv.setPointerCapture(e.pointerId);var p=pos(e);
if(tool=='er'&&em==0){drawing={er:true,rem:[]};erase(p);return;}
if(tool=='er'&&em==1){drawing={z:true,pts:[p]};lastP=p;redraw();dS(drawing);return;}
drawing={c:cc(),w:[1.2,2.4,4][wd],hl:tool=='hl',hw:HW[hwd],ha:(tool=='hl'&&hcol==4)?.88:.55,pts:[p]};lastP=p;});
cv.addEventListener('pointermove',function(e){if(!drawing)return;var p=pos(e);
if(drawing.er){erase(p);return;}
if(drawing.st){drawing.pts=[drawing.pts[0],p];redraw();dS(drawing);return;}
if(Math.hypot(p[0]-lastP[0],p[1]-lastP[1])>1.5/z){drawing.pts.push(p);lastP=p;clearTimeout(tmr);
if(!drawing.z&&drawing.pts.length>4)tmr=setTimeout(function(){if(drawing&&!drawing.er&&!drawing.z){drawing.st=true;drawing.pts=[drawing.pts[0],drawing.pts[drawing.pts.length-1]];redraw();dS(drawing);}},480);}
redraw();dS(drawing);});
function end(){clearTimeout(tmr);if(!drawing)return;if(drawing.er){if(drawing.rem.length){undo.push({k:'er',s:drawing.rem});redo=[];}}else{P().strokes.push(drawing);undo.push({k:'s',s:drawing});redo=[];}drawing=null;redraw();}
cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);
function erase(p){var S=P().strokes;for(var i=S.length-1;i>=0;i--){if(S[i].z)continue;var a=S[i].pts,hit;if(S[i].st&&a.length==2){var A=a[0],B=a[1],dx=B[0]-A[0],dy=B[1]-A[1],L=dx*dx+dy*dy||1,t=Math.max(0,Math.min(1,((p[0]-A[0])*dx+(p[1]-A[1])*dy)/L));hit=Math.hypot(A[0]+t*dx-p[0],A[1]+t*dy-p[1])<9;}else hit=a.some(function(q){return Math.hypot(q[0]-p[0],q[1]-p[1])<9;});if(hit)drawing.rem.push(S.splice(i,1)[0]);}redraw();}
var drag=null;
inner.addEventListener('pointerdown',function(e){if(e.target===cv)return;
var g=e.target.closest('[data-g]'),d=e.target.closest('[data-d]');
if(d&&tool=='hand'){var O=P().objs,i=O.findIndex(function(o){return o.id==+d.dataset.d});var o=O.splice(i,1)[0];undo.push({k:'od',o:o});redo=[];drawObjs();return;}
if(g&&tool=='hand'){var o=P().objs.find(function(o){return o.id==+g.dataset.g});var p=pos(e);drag={o:o,dx:p[0]-o.x,dy:p[1]-o.y,el:g.parentNode};inner.setPointerCapture(e.pointerId);e.preventDefault();return;}
if(['tx','scr','pi','ph','vd','ln'].indexOf(tool)>=0&&!e.target.closest('.ob')){var p=pos(e);var o={id:nid++,t:tool,s:ts,x:Math.round(p[0]),y:Math.round(p[1]),v:tool=='tx'?'Ton texte ici':tool=='scr'?'Écris ici au Pencil…':'',c:pic,c2:(tool=='tx'||tool=='scr')?COL[col]:null};P().objs.push(o);undo.push({k:'o',o:o});redo=[];drawObjs();focusId=o.id;}});
inner.addEventListener('pointermove',function(e){if(!drag)return;var p=pos(e);drag.o.x=Math.round(p[0]-drag.dx);drag.o.y=Math.round(p[1]-drag.dy);drag.el.style.left=drag.o.x+'px';drag.el.style.top=drag.o.y+'px';});
inner.addEventListener('pointerup',function(){drag=null;});
objs.addEventListener('input',function(e){var ob=e.target.closest('.ob');if(!ob)return;var o=P().objs.find(function(x){return x.id==+ob.dataset.id});if(o)o.v=e.target.innerHTML;});
document.getElementById('un').onclick=function(){var a=undo.pop();if(!a)return;var S=P().strokes,O=P().objs;if(a.k=='s')S.splice(S.indexOf(a.s),1);if(a.k=='er')a.s.forEach(function(s){S.push(s)});if(a.k=='o')O.splice(O.indexOf(a.o),1);if(a.k=='od')O.push(a.o);redo.push(a);drawObjs();redraw();};
document.getElementById('re').onclick=function(){var a=redo.pop();if(!a)return;var S=P().strokes,O=P().objs;if(a.k=='s')S.push(a.s);if(a.k=='er')a.s.forEach(function(s){S.splice(S.indexOf(s),1)});if(a.k=='o')O.push(a.o);if(a.k=='od')O.splice(O.indexOf(a.o),1);undo.push(a);drawObjs();redraw();};
document.getElementById('zi').onclick=function(){z=Math.min(2.5,z+0.5);applyZ();};
document.getElementById('zo').onclick=function(){z=Math.max(1,z-0.5);applyZ();if(z==1){page.scrollTop=0;page.scrollLeft=0;}};
document.getElementById('papb').onclick=function(){P().paper=(P().paper+1)%PAP.length;drawPage();};
document.getElementById('addp').onclick=function(){pages.splice(cur+1,0,{paper:P().paper,strokes:[],objs:[]});cur++;undo=[];redo=[];drawPage();};
document.getElementById('pp').onclick=function(){if(cur>0){cur--;undo=[];redo=[];drawPage();}};
document.getElementById('np').onclick=function(){if(cur<pages.length-1){cur++;undo=[];redo=[];drawPage();}};
drawTb();drawOpt();sync();drawPage();size();window.addEventListener('resize',size);
})();
</script>
